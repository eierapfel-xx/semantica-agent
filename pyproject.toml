[project]
name = "semantica-agent"
version = "0.1.0"
description = "semantica で業務手順のオントロジーを作り、それを使うエージェントを作る"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # オントロジー構築・SHACL 検証・RDF ストア・PDF 解析・可視化。LLM 系 extra は入れない（API キー不要の構成）。
    "semantica[parse-pdf,shacl,tripletstore-oxigraph,viz]>=0.7.0",
    # エージェント本体。Claude Code のログイン（Pro）で動く。
    "claude-agent-sdk>=0.2.182",
    "jpholiday>=1.0.3",
]

[dependency-groups]
dev = [
    "mdformat>=0.7.22",
    "mdformat-gfm>=0.4.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semantica_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# rdflib の XSD 名前空間を pytest が調べるときに出る無害な警告
filterwarnings = ["ignore:Code. _mock_name is not defined in namespace XSD:UserWarning"]
markers = [
    "slow: 時間のかかるテスト",
    "llm: Claude（Agent SDK）を実際に呼ぶテスト。Pro の利用枠を消費する",
]

[tool.coverage.run]
source = ["src/semantica_agent"]
